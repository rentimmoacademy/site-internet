name: Newsletter on blog publish

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**.mdx"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new articles and send newsletter
        env:
          SYSTEMEIO_API_KEY: ${{ secrets.SYSTEMEIO_API_KEY }}
        run: node scripts/newsletter-on-publish.mjs
